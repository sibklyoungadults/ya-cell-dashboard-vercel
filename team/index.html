<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YA Cell Team Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/shared/dashboard.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <div class="header-title">⛪ YA Cell Team Dashboard</div>
    <div class="header-sub">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Connecting…</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">↻ Refresh</button>
    <button class="logout-btn" onclick="doLogout()">Log out</button>
  </div>
</div>

<!-- Navigation -->
<div class="nav">
  <button class="nav-tab active" id="tab-celllist"  onclick="switchPage('celllist')">🗂️ Bookings by Cell Group</button>
  <button class="nav-tab"        id="tab-wagen"     onclick="switchPage('wagen')">💬 Send Reminder</button>
  <button class="nav-tab"        id="tab-newcomers" onclick="switchPage('newcomers')">👥 Newcomers</button>
  <button class="nav-tab"        id="tab-edm"       onclick="switchPage('edm')">📧 Email Templates</button>
</div>

<!-- Page: Cell List (per-cell overview across all upcoming dates, through December) -->
<div id="page-celllist" class="page">
  <div class="table-toolbar" style="margin-bottom:12px">
    <span style="font-size:12px;color:#6b7280">Every cell, with all its upcoming dates &amp; rooms — through 31 December</span>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <input class="search-box" type="text" id="cellSearch" placeholder="🔍 Search cell name…" oninput="renderCellOverview()">
      <button class="copy-all-btn" id="copyAllBtn" onclick="copyAllCells(this)">📋 Copy All</button>
    </div>
  </div>
  <div id="cellListContent"></div>
</div>

<!-- Page: WA Messages (per-event, ready-to-send templates) -->
<div id="page-wagen" class="page" style="display:none">
  <div class="chips-row" id="eventChipsWA"></div>
  <div id="wagenContent"></div>
</div>

<!-- Page: Newcomers -->
<div id="page-newcomers" class="page" style="display:none">
  <label class="upload-zone" id="uploadZone"
    ondragover="dragOver(event)" ondragleave="dragLeave()" ondrop="dropFile(event)">
    <input type="file" id="csvInput" accept=".csv" onchange="handleFile(this.files[0])">
    <div class="upload-icon">📋</div>
    <div class="upload-title">Upload Newcomer CSV</div>
    <div class="upload-sub">Drag & drop or click below to load your newcomer list</div>
    <span class="upload-cta" onclick="event.preventDefault(); document.getElementById('csvInput').click()">Choose CSV File</span>
  </label>
  <div id="newcomerSection" style="display:none">
    <div class="nc-controls">
      <div class="nc-ctrl-row">
        <span class="nc-ctrl-label">Sort</span>
        <button class="sort-btn active" id="sort-az"     onclick="setSort('az')">A → Z</button>
        <button class="sort-btn"        id="sort-za"     onclick="setSort('za')">Z → A</button>
        <button class="sort-btn"        id="sort-recent" onclick="setSort('recent')">🕐 Recent Contact</button>
        <span style="flex:1;min-width:8px"></span>
        <input class="search-box" type="text" id="ncSearch" placeholder="🔍 Search name, cell…" oninput="renderNC()">
      </div>
      <div class="nc-ctrl-row">
        <span class="nc-ctrl-label">Filter</span>
        <button class="fchip active" id="fchip-all"  onclick="setFilter('all')">All</button>
        <button class="fchip"        id="fchip-week" onclick="setFilter('week')">This Week</button>
        <button class="fchip"        id="fchip-30"   onclick="setFilter('30')">≤ 30 days</button>
        <button class="fchip warn"   id="fchip-31"   onclick="setFilter('31')">31 – 60 days</button>
        <button class="fchip danger" id="fchip-60"   onclick="setFilter('60')">60+ days</button>
        <span class="nc-count" id="ncCount" style="margin-left:auto;white-space:nowrap;font-size:12px;color:#6b7280"></span>
      </div>
    </div>
    <div class="nc-table-wrap">
      <table class="nc-table">
        <thead><tr id="ncHead"></tr></thead>
        <tbody id="ncBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Page: Email Templates (EDM, isolated in an iframe to avoid style/script collisions) -->
<div id="page-edm" class="page" style="display:none; padding:0;">
  <iframe id="edmFrame" title="Email Templates" style="width:100%; height:85vh; border:none; display:block; background:#E8DDD3;"></iframe>
</div>

<script src="/shared/booking-utils.js"></script>
<script>
// ── AUTH ─────────────────────────────────────────────────────────────────
async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/team/login.html';
}

// ── STATE ────────────────────────────────────────────────────────────────
let liveEventsCL     = null;  // extended dataset (through Dec) — powers Cell Group + Send Reminder tabs
let lastFetchTimeCL  = null;
let isFetchingCL     = false;
let selectedIdxWA    = 0;
let CELL_OVERVIEW_TEXTS = [];
const REFRESH_MS = 5 * 60 * 1000;

function fmtRelative(date) {
  const diff = Math.floor((Date.now() - date.getTime()) / 1000);
  if (diff < 10)  return 'just now';
  if (diff < 60)  return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return date.toLocaleTimeString('en-SG', { hour:'numeric', minute:'2-digit', hour12:true });
}
function setStatus(state, detail) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const btn  = document.getElementById('refreshBtn');
  dot.className = 'status-dot ' + state;
  if (state === 'loading') { text.textContent = 'Refreshing…'; btn.disabled = true; btn.innerHTML = '<span class="spin">↻</span> Refresh'; }
  else if (state === 'live') { text.textContent = 'Live · ' + fmtRelative(lastFetchTimeCL); btn.disabled = false; btn.innerHTML = '↻ Refresh'; }
  else if (state === 'error') { text.textContent = 'Cached data · ' + (detail || ''); btn.disabled = false; btn.innerHTML = '↻ Refresh'; }
  else { text.textContent = detail || ''; btn.disabled = false; btn.innerHTML = '↻ Refresh'; }
}
setInterval(() => { if (lastFetchTimeCL && !isFetchingCL) setStatus('live'); }, 30000);

// Fetches today → end of December (retries once before falling back).
async function fetchLiveEventsCL() {
  if (isFetchingCL) return;
  isFetchingCL = true;
  setStatus('loading');

  const maxAttempts = 2;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const events = await fetchCalendarEvents({
        startTime: getSGTMidnight(0),
        endTime:   getSGTEndOfDecember()
      });
      if (events.length === 0) throw new Error('No events returned');
      liveEventsCL    = events;
      lastFetchTimeCL = new Date();
      renderCellOverview();
      buildWAChips(selectedIdxWA);
      setStatus('live');
      lastErr = null;
      break;
    } catch (err) {
      lastErr = err;
      console.warn(`Cell Group fetch attempt ${attempt} failed:`, err);
      if (attempt < maxAttempts) await sleep(2000);
    }
  }
  if (lastErr) {
    if (!liveEventsCL) { liveEventsCL = FALLBACK_EVENTS; renderCellOverview(); buildWAChips(); }
    setStatus('error', lastFetchTimeCL ? ('last: ' + fmtRelative(lastFetchTimeCL)) : 'using cached');
  }
  isFetchingCL = false;
}
function manualRefresh() { fetchLiveEventsCL(); }
setInterval(fetchLiveEventsCL, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const stale = !lastFetchTimeCL || (Date.now() - lastFetchTimeCL.getTime() > REFRESH_MS);
    if (stale) fetchLiveEventsCL(); else if (lastFetchTimeCL) setStatus('live');
  }
});

// ── PAGE SWITCH ──────────────────────────────────────────────────────────
function switchPage(page) {
  ['celllist','wagen','newcomers','edm'].forEach(p => {
    document.getElementById('page-' + p).style.display = p === page ? '' : 'none';
    document.getElementById('tab-' + p).classList.toggle('active', p === page);
  });
  if (page === 'edm') ensureEdmLoaded();
}

// ── COPY TO CLIPBOARD helpers already in booking-utils.js (copyToClipboard, flashCopied) ──
function copyCellText(i, btn) {
  const text = CELL_OVERVIEW_TEXTS[i];
  if (!text) return;
  copyToClipboard(text);
  flashCopied(btn, '📋 Copy');
}
function copyAllCells(btn) {
  if (!CELL_OVERVIEW_TEXTS.length) return;
  copyToClipboard(CELL_OVERVIEW_TEXTS.join('\n\n'));
  flashCopied(btn, '📋 Copy All');
}

// ── CELL LIST PAGE (cell-first grouping) ────────────────────────────────
function renderCellOverview() {
  const events = liveEventsCL || FALLBACK_EVENTS;
  const searchEl = document.getElementById('cellSearch');
  const search = searchEl ? searchEl.value.toLowerCase().trim() : '';

  const known     = new Map();
  const unmatched = new Map();

  events.forEach(ev => {
    if (!ev.description) return;
    const rows = ev.description.split('\n').map(parseLine).filter(Boolean);
    rows.forEach(({ room, cg }) => {
      const ac     = isAC(room);
      const piano  = hasPiano(room) || hasPiano(cg);
      const guitar = hasGuitar(room) || hasGuitar(cg);
      const cleanRoom = cleanRoomName(room);
      const booking = { date: ev.date, room: cleanRoom, ac, piano, guitar };

      const idx = cellOrderIndex(cg);
      if (idx < CELL_ORDER.length) {
        if (!known.has(idx)) known.set(idx, { name: CELL_ORDER[idx], bookings: [] });
        known.get(idx).bookings.push(booking);
      } else {
        const key = cg.trim().toLowerCase();
        if (!unmatched.has(key)) unmatched.set(key, { name: cg.trim(), bookings: [] });
        unmatched.get(key).bookings.push(booking);
      }
    });
  });

  let cells = CELL_ORDER.map((name, i) => known.get(i) || { name, bookings: [] });
  const extras = [...unmatched.values()].sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  cells = cells.concat(extras);
  cells.forEach(c => c.bookings.sort((a, b) => new Date(a.date) - new Date(b.date)));

  if (search) cells = cells.filter(c => c.name.toLowerCase().includes(search));

  const content = document.getElementById('cellListContent');
  if (!cells.length) {
    CELL_OVERVIEW_TEXTS = [];
    content.innerHTML = '<div class="no-rooms">No cells match this search.</div>';
    return;
  }

  const todayHeaderShort = fmtTodayHeaderShort();
  CELL_OVERVIEW_TEXTS = cells.map(c => {
    let body;
    if (!c.bookings.length) {
      body = 'No upcoming bookings';
    } else {
      const groups = [];
      let curKey = null, curLines = null;
      c.bookings.forEach(b => {
        const key = monthGroupKey(b.date);
        if (key !== curKey) {
          curKey = key;
          curLines = [];
          groups.push({ label: monthGroupLabel(b.date), lines: curLines });
        }
        const tags = `${b.ac ? ' (AC)' : ''}${b.piano ? ' (Piano)' : ''}${b.guitar ? ' (Guitar)' : ''}`;
        curLines.push(`• ${fmtBookingLineDate(b.date)} – ${b.room}${tags}`);
      });
      body = groups.map(g => `*${g.label}*\n${g.lines.join('\n')}`).join('\n\n');
    }
    return `*${c.name}*\n_Upcoming bookings as of ${todayHeaderShort}_\n\n${body}`;
  });

  content.innerHTML = cells.map((c, i) => {
    const rowsHtml = c.bookings.length
      ? c.bookings.map(b => {
          const pianoTag  = b.piano ? `<span class="badge badge-piano">🎹 Piano</span>` : '';
          const guitarTag = b.guitar ? `<span class="badge badge-guitar">🎸 Guitar</span>` : '';
          const typeBadge = b.ac ? `<span class="badge badge-ac">❄️ AC Remote</span>` : `<span class="badge badge-std">Standard</span>`;
          const todayTag = isToday(b.date) ? '<span class="day-badge is-today" style="margin-left:6px">Today</span>' : '';
          return `<tr><td>${esc(fmtDateLong(b.date))}${todayTag}</td><td>${esc(b.room)}</td><td>${typeBadge}${pianoTag}${guitarTag}</td></tr>`;
        }).join('')
      : `<tr><td colspan="3" style="text-align:center;color:#bbb;padding:14px">No upcoming bookings</td></tr>`;

    return `<div class="room-card" style="margin-bottom:12px">
      <div class="cell-card-head">
        <span class="cell-card-title">${esc(c.name)}</span>
        <button class="mini-copy-btn" onclick="copyCellText(${i}, this)">📋 Copy</button>
      </div>
      <div class="room-table-scroll"><table class="room-table">
        <thead><tr><th class="col-wide">Date</th><th>Room</th><th class="col-fixed">Request type</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

// ── WA MESSAGES PAGE (per-event, ready-to-send templates) ───────────────
const WA_SPECIAL = ['guest lounge','m6-2'];
function isWASpecial(room) { return WA_SPECIAL.some(s => room.toLowerCase().includes(s)); }
const AV_LINK = "https://tiny.cc/ya26cgroom";

function buildWAT1(date, cg, loc, hasPianoFlag, hasGuitarFlag) {
  let n = 3;
  let extra = '';
  if (hasPianoFlag)  { extra += `\n${n}.⁠ ⁠*Piano collection/return*🎹: office front desk`;  n++; }
  if (hasGuitarFlag) { extra += `\n${n}.⁠ ⁠*Guitar collection/return*🎸: office front desk`; n++; }
  return `*Date:* ${date}\n\n*Cell group:* ${cg}\n\n*Location:* ${loc}\n\n*Note:*\n1.⁠ ⁠*Key collection/return*🔑: guard post (level 4).\n•⁠  ⁠Can collect anytime from 5pm & onwards\n2.⁠ ⁠*Sound system & projector setup guide*🎥: ${AV_LINK}${extra}\n${n}.⁠ ⁠*CG Signange return*🪧: guard post (level 4)\n•⁠  ⁠Pls return together with keys ✨`;
}
function buildWAT2(date, cg, loc, hasPianoFlag, hasGuitarFlag) {
  let n = 4;
  let extra = '';
  if (hasPianoFlag)  { extra += `\n${n}.⁠ ⁠*Piano collection/return*🎹: office front desk`;  n++; }
  if (hasGuitarFlag) { extra += `\n${n}.⁠ ⁠*Guitar collection/return*🎸: office front desk`; n++; }
  return `*Date:* ${date}\n\n*Cell group:* ${cg}\n\n*Location:* ${loc}\n\n*Note:*\n1.⁠ ⁠*Key collection/return*🔑: guard post (level 4).\n•⁠  ⁠Can collect anytime from 5pm & onwards\n2.⁠ ⁠*Sound system & projector setup guide*🎥: ${AV_LINK}\n3.⁠ ⁠*Aircon Remote collection/return* ❄️: guard post (level 4)\n•⁠  ⁠Pls check all aircons are switched off ☺️${extra}\n${n}.⁠ ⁠*CG Signange return*🪧: guard post (level 4)\n•⁠  ⁠Pls return together with keys ✨`;
}

function copyWAMsg(btn, id) {
  const ta = document.getElementById(id);
  ta.select(); ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
  } catch (e) { alert('Text is selected — press Cmd+C to copy.'); }
}

function buildWAChips(keepIdx) {
  const events = liveEventsCL || FALLBACK_EVENTS;
  const row = document.getElementById('eventChipsWA');
  row.innerHTML = '';
  const now = new Date();
  let defaultIdx = 0;
  events.forEach((ev, i) => {
    const d = new Date(ev.date);
    if (d < now && !isToday(ev.date) && defaultIdx === i) defaultIdx = i + 1;
    const btn = document.createElement('button');
    btn.className = 'chip' + (isToday(ev.date) ? ' today' : '');
    btn.textContent = fmtShort(ev.date);
    btn.onclick = () => showWAEvent(i);
    row.appendChild(btn);
  });
  if (defaultIdx >= events.length) defaultIdx = 0;
  const idx = (keepIdx !== undefined && keepIdx < events.length) ? keepIdx : defaultIdx;
  showWAEvent(idx);
}

function showWAEvent(idx) {
  const events = liveEventsCL || FALLBACK_EVENTS;
  selectedIdxWA = idx;
  document.querySelectorAll('#eventChipsWA .chip').forEach((c, i) => c.classList.toggle('active', i === idx));
  const ev = events[idx];
  const date = fmtDateNoTime(ev.date);
  const content = document.getElementById('wagenContent');

  if (!ev.description) {
    content.innerHTML = '<div class="no-rooms">No room bookings in this event\'s description yet.</div>';
    return;
  }

  const lines = ev.description.split('\n');
  let msgIdx = 0;
  let any = false;
  let html = '<div class="wa-messages">';

  lines.forEach(line => {
    const parsed = parseLine(line);
    if (!parsed) return;
    any = true;
    const { room, cg } = parsed;
    const special = isWASpecial(room);
    const hasPianoFlag = hasPiano(room) || hasPiano(cg);
    const hasGuitarFlag = hasGuitar(room) || hasGuitar(cg);
    const cleanRoom = cleanRoomName(room);
    const cleanCg = cg.trim();
    const msg = special ? buildWAT2(date, cleanCg, cleanRoom, hasPianoFlag, hasGuitarFlag) : buildWAT1(date, cleanCg, cleanRoom, hasPianoFlag, hasGuitarFlag);
    const id = `wamsg-${idx}-${msgIdx++}`;
    const instrTags = (hasPianoFlag ? ' 🎹' : '') + (hasGuitarFlag ? ' 🎸' : '');
    html += `
      <div class="wa-msg-block">
        <div class="wa-msg-header">
          <span class="wa-msg-label">📍 ${esc(cleanRoom)} · ${esc(cleanCg)}${instrTags}</span>
          <span class="wa-msg-badge ${special ? 'wa-badge-sp' : 'wa-badge-std'}">${special ? 'Template 2 (AC)' : 'Template 1'}</span>
        </div>
        <textarea class="wa-msg-body" id="${id}" readonly onclick="this.select()">${esc(msg)}</textarea>
        <button class="wa-copy-btn" onclick="copyWAMsg(this,'${id}')">📋 Copy</button>
      </div>`;
  });

  html += '</div>';
  if (!any) {
    content.innerHTML = '<div class="no-rooms">No room bookings in this event\'s description yet.</div>';
    return;
  }
  content.innerHTML = html;
  content.querySelectorAll('.wa-msg-body').forEach(ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
}

// ── NEWCOMERS PAGE ────────────────────────────────────────────────────────
const NC_COL_DEFS = [
  { label: 'Full Name',         keys: ['full name','name'] },
  { label: 'Gender',            keys: ['gender'] },
  { label: 'Phone',             keys: ['phone','contact'] },
  { label: 'Attending Service', keys: ['attending','service'] },
  { label: 'Cell / Assignee',   keys: ['cell','assign'] },
  { label: 'Last Contacted',    keys: ['last contact','contacted','last'] },
];

let ncRows     = [];
let ncColMap   = [];
let ncSortType = 'az';
let ncFilter   = 'all';

function dragOver(e) { e.preventDefault(); document.getElementById('uploadZone').classList.add('drag'); }
function dragLeave()  { document.getElementById('uploadZone').classList.remove('drag'); }
function dropFile(e)  { e.preventDefault(); dragLeave(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const { headers, rows } = parseCSV(e.target.result);
    if (!rows.length) { alert('No data found in this CSV.'); return; }
    loadNewcomers(headers, rows);
  };
  reader.readAsText(file);
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return { headers: [], rows: [] };
  const headers = parseCSVRow(lines[0]);
  const rows = lines.slice(1).filter(l => l.trim()).map(l => {
    const vals = parseCSVRow(l);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  });
  return { headers, rows };
}

function parseCSVRow(line) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1]==='"') { cur+='"'; i++; } else q=!q; }
    else if (c === ',' && !q) { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}

function findHeader(headers, keys) {
  for (const k of keys) {
    const h = headers.find(h => h.toLowerCase().includes(k.toLowerCase()));
    if (h) return h;
  }
  return null;
}

function parseContactDate(str) {
  if (!str || str === '–' || !str.trim()) return null;
  str = str.trim();
  let d = new Date(str);
  if (!isNaN(d.getTime()) && d.getFullYear() > 2000) return d;
  let m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) { d = new Date(+m[3], +m[2]-1, +m[1]); if (!isNaN(d.getTime())) return d; }
  m = str.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);
  if (m) { d = new Date(`${m[2]} ${m[1]}, ${m[3]}`); if (!isNaN(d.getTime())) return d; }
  return null;
}

function getDaysAgo(str) {
  const d = parseContactDate(str);
  return d ? Math.floor((Date.now() - d.getTime()) / 86400000) : null;
}

function setSort(type) {
  ncSortType = type;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('sort-' + type);
  if (btn) btn.classList.add('active');
  renderNC();
}

function setFilter(f) {
  ncFilter = f;
  document.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('fchip-' + f);
  if (btn) btn.classList.add('active');
  renderNC();
}

function loadNewcomers(headers, rows) {
  ncRows = rows;
  ncColMap = NC_COL_DEFS
    .map(def => ({ label: def.label, rawKey: findHeader(headers, def.keys) }))
    .filter(c => c.rawKey);

  const thead = document.getElementById('ncHead');
  thead.innerHTML = '';
  ncColMap.forEach(col => {
    const th = document.createElement('th');
    th.textContent = col.label;
    thead.appendChild(th);
  });

  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('newcomerSection').style.display = '';

  setSort('az');
  setFilter('all');
}

function renderNC() {
  const search = (document.getElementById('ncSearch').value || '').toLowerCase();
  const contactCol = ncColMap.find(c => c.label === 'Last Contacted');
  const nameCol = ncColMap.find(c => c.label === 'Full Name');

  let rows = ncRows.filter(row => {
    if (ncFilter === 'all') return true;
    if (!contactCol) return true;
    const days = getDaysAgo(row[contactCol.rawKey]);
    if (days === null) return false;
    if (ncFilter === 'week') return days <= 7;
    if (ncFilter === '30')   return days <= 30;
    if (ncFilter === '31')   return days >= 31 && days < 60;
    if (ncFilter === '60')   return days >= 60;
    return true;
  });

  if (search) rows = rows.filter(row => Object.values(row).some(v => v.toLowerCase().includes(search)));

  rows = [...rows].sort((a, b) => {
    if (ncSortType === 'az' || ncSortType === 'za') {
      const key = nameCol ? nameCol.rawKey : (ncColMap[0] ? ncColMap[0].rawKey : null);
      if (!key) return 0;
      const av = (a[key]||'').toLowerCase(), bv = (b[key]||'').toLowerCase();
      return ncSortType === 'az' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    if (ncSortType === 'recent' && contactCol) {
      const da = parseContactDate(a[contactCol.rawKey]);
      const db = parseContactDate(b[contactCol.rawKey]);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return db.getTime() - da.getTime();
    }
    return 0;
  });

  document.getElementById('ncCount').textContent =
    rows.length === ncRows.length ? `${rows.length} newcomer${rows.length !== 1 ? 's' : ''}` : `${rows.length} of ${ncRows.length}`;

  const tbody = document.getElementById('ncBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${ncColMap.length}" class="empty-nc">No newcomers match this filter.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(row =>
    '<tr>' + ncColMap.map(col => {
      const val = row[col.rawKey] || '–';
      let cls = '';
      if (col.label === 'Gender') cls = val.toLowerCase().startsWith('m') ? 'gender-m' : val.toLowerCase().startsWith('f') ? 'gender-f' : '';
      if (col.label === 'Last Contacted') {
        const days = getDaysAgo(val);
        if (days !== null) cls = days >= 60 ? 'days-danger' : days >= 31 ? 'days-warn' : '';
      }
      return `<td${cls ? ` class="${cls}"` : ''}>${esc(val)}</td>`;
    }).join('') + '</tr>'
  ).join('');
}
