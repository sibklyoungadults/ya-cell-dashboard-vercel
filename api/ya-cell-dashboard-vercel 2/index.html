<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#128C7E">
</head><body>
<title>YA Cell Dashboard</title>
<style>
:root { color-scheme: light; }
body{color:#111}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f2f5; min-height: 100vh; font-size: 14px;
}

/* ── Header ── */
.header {
  background: #fff; border-bottom: 1px solid #e5e7eb;
  padding: 12px 18px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; gap: 10px;
}
.header-title { font-size: 16px; font-weight: 700; color: #111; letter-spacing: -0.2px; }
.header-sub { font-size: 11px; color: #9ca3af; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.status-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #d1d5db; transition: background 0.3s;
}
.status-dot.live    { background: #25d366; }
.status-dot.loading { background: #f59e0b; animation: pulse 0.8s ease-in-out infinite; }
.status-dot.error   { background: #ef4444; }
.status-text { color: #6b7280; font-size: 11px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.refresh-btn {
  background: #128C7E; color: #fff; border: none;
  border-radius: 8px; padding: 7px 14px;
  font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background 0.15s;
}
.refresh-btn:hover { background: #0f7068; }
.refresh-btn:disabled { background: #9ca3af; cursor: default; }
.spin { display: inline-block; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Nav ── */
.nav {
  display: flex; background: #fff;
  border-bottom: 1px solid #e5e7eb; padding: 0 18px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: thin; scrollbar-color: #d1d5db transparent;
}
.nav::-webkit-scrollbar { height: 3px; }
.nav::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
.nav-tab {
  padding: 11px 16px; font-size: 13px; font-weight: 500; color: #6b7280;
  background: none; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.nav-tab:hover { color: #128C7E; }
.nav-tab.active { color: #128C7E; border-bottom-color: #128C7E; font-weight: 700; }

/* ── Pages ── */
.page { padding: 16px 18px; }

/* ── Chips ── */
.chips-row {
  display: flex; gap: 7px; overflow-x: auto;
  padding-bottom: 6px; margin-bottom: 14px;
  scrollbar-width: thin; scrollbar-color: #d1d5db transparent;
}
.chips-row::-webkit-scrollbar { height: 4px; }
.chips-row::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
.chip {
  flex-shrink: 0; border: 1.5px solid #e0e0e0; border-radius: 20px;
  padding: 6px 13px; font-size: 12px; cursor: pointer;
  background: #fff; color: #555; white-space: nowrap; transition: all 0.15s;
}
.chip:hover { border-color: #25d366; color: #128C7E; }
.chip.active { background: #128C7E; border-color: #128C7E; color: #fff; font-weight: 600; }
.chip.today { border-color: #f59e0b; color: #b45309; }
.chip.today.active { background: #f59e0b; border-color: #f59e0b; color: #fff; }

/* ── Event heading ── */
.event-heading {
  font-size: 14px; font-weight: 700; color: #111;
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.day-badge {
  font-size: 11px; font-weight: 600; padding: 2px 9px;
  border-radius: 20px; background: #dcfce7; color: #166534;
}
.day-badge.is-today { background: #fef3c7; color: #92400e; }
.date-summary { font-size: 12.5px; color: #4b5563; line-height: 1.5; margin: -6px 0 14px 0; }

/* ── Room table ── */
.room-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; }
.room-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.room-table { width: 100%; min-width: 460px; border-collapse: collapse; }
.room-table th {
  text-align: left; padding: 9px 14px;
  font-size: 10px; font-weight: 700; color: #9ca3af;
  text-transform: uppercase; letter-spacing: 0.6px;
  background: #f9fafb; border-bottom: 1px solid #f0f0f0;
}
.room-table td { padding: 10px 14px; color: #222; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
.room-table tr:last-child td { border-bottom: none; }
.room-table tr:hover td { background: #fafafa; }
.room-name { font-weight: 600; color: #111; }
.col-wide  { width: 34%; }
.col-fixed { width: 210px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
.badge-std   { background: #dcfce7; color: #166534; }
.badge-ac    { background: #dbeafe; color: #1e40af; }
.badge-piano { background: #fef3c7; color: #92400e; margin-left: 4px; }
.badge-guitar { background: #ede9fe; color: #5b21b6; margin-left: 4px; }
.no-rooms { text-align: center; color: #bbb; font-size: 13px; padding: 36px 20px; background: #fff; border-radius: 12px; }

/* ── Skeleton loader ── */
.skeleton { background: #f0f0f0; border-radius: 6px; animation: shimmer 1.2s infinite; }
@keyframes shimmer { 0%,100%{opacity:0.6} 50%{opacity:1} }

/* ── Newcomers ── */
#page-newcomers { max-width: 900px; margin: 0 auto; }
.upload-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 2px dashed #d1d5db; border-radius: 12px;
  padding: 40px 20px; background: #fff;
  cursor: pointer; transition: all 0.2s; margin-bottom: 16px;
}
.upload-zone:hover, .upload-zone.drag { border-color: #25d366; background: #f0fdf4; }
.upload-zone input[type="file"] { display: none; }
.upload-icon  { font-size: 36px; margin-bottom: 10px; }
.upload-title { font-size: 15px; font-weight: 700; color: #374151; margin-bottom: 4px; text-align: center; }
.upload-sub   { font-size: 12px; color: #9ca3af; margin-bottom: 14px; text-align: center; }
.upload-cta {
  display: inline-block; background: #128C7E; color: #fff; border: none;
  border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.upload-cta:hover { background: #0f7068; }
.table-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.nc-count { font-size: 12px; color: #6b7280; }
.search-box { border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 6px 11px; font-size: 13px; outline: none; width: 190px; transition: border-color 0.15s; }
.search-box:focus { border-color: #128C7E; }
.nc-table-wrap { overflow-x: auto; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.nc-table { width: 100%; border-collapse: collapse; background: #fff; }
.nc-table th {
  text-align: left; padding: 9px 13px; font-size: 10px; font-weight: 700; color: #9ca3af;
  text-transform: uppercase; letter-spacing: 0.5px; background: #f9fafb;
  border-bottom: 1px solid #f0f0f0; cursor: pointer; user-select: none; white-space: nowrap;
}
.nc-table th:hover { color: #128C7E; }
.nc-table th.sort-asc::after  { content: ' ↑'; color: #128C7E; }
.nc-table th.sort-desc::after { content: ' ↓'; color: #128C7E; }
.nc-table td { padding: 9px 13px; color: #222; border-bottom: 1px solid #f5f5f5; white-space: nowrap; }
.nc-table tr:last-child td { border-bottom: none; }
.nc-table tr:hover td { background: #fafafa; }
.gender-m { color: #1d4ed8; font-weight: 600; }
.gender-f { color: #be185d; font-weight: 600; }
.days-warn   { color: #b45309; font-weight: 600; }
.days-danger { color: #dc2626; font-weight: 600; }
.empty-nc { text-align: center; color: #bbb; font-size: 13px; padding: 36px; }

/* ── NC Controls ── */
.nc-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.nc-ctrl-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nc-ctrl-label { font-size: 10px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; min-width: 38px; }
.sort-btn {
  border: 1.5px solid #e0e0e0; border-radius: 7px;
  padding: 5px 11px; font-size: 12px; font-weight: 500;
  background: #fff; color: #555; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.sort-btn:hover { border-color: #128C7E; color: #128C7E; }
.sort-btn.active { background: #128C7E; border-color: #128C7E; color: #fff; font-weight: 700; }
.fchip {
  border: 1.5px solid #e0e0e0; border-radius: 20px;
  padding: 5px 12px; font-size: 12px; font-weight: 500;
  background: #fff; color: #555; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.fchip:hover { border-color: #128C7E; color: #128C7E; }
.fchip.active { background: #128C7E; border-color: #128C7E; color: #fff; font-weight: 700; }
.fchip.warn.active   { background: #f59e0b; border-color: #f59e0b; }
.fchip.danger.active { background: #ef4444; border-color: #ef4444; }

/* ── Cell overview copy buttons ── */
.cell-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px; border-bottom: 1px solid #f0f0f0; background: #f9fafb; }
.cell-card-title { font-weight: 700; font-size: 13.5px; color: #111; }
.mini-copy-btn { flex-shrink: 0; background: #f0f0f0; border: none; border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; color: #333; white-space: nowrap; }
.mini-copy-btn:hover { background: #e0e0e0; }
.mini-copy-btn.copied { background: #d4edda; color: #1a7431; }
.copy-all-btn { background: #fff; border: 1.5px solid #128C7E; color: #128C7E; border-radius: 8px; padding: 6px 13px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.copy-all-btn:hover { background: #f0fdf4; }
.copy-all-btn.copied { background: #d4edda; border-color: #1a7431; color: #1a7431; }

/* ── WA Messages ── */
.wa-messages { display: flex; flex-direction: column; gap: 12px; }
.wa-msg-block { border: 1.5px solid #e8e8e8; border-radius: 10px; overflow: hidden; background: #fff; }
.wa-msg-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; background: #f9f9f9; border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; gap: 6px; }
.wa-msg-label { font-size: 13px; font-weight: 600; color: #333; }
.wa-msg-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.wa-badge-std { background: #dcfce7; color: #166534; }
.wa-badge-sp  { background: #dbeafe; color: #1e40af; }
.wa-msg-body { display: block; width: 100%; padding: 11px 13px; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; font-family: inherit; color: #222; background: white; border: none; outline: none; resize: none; cursor: text; overflow: hidden; }
.wa-copy-btn { display: flex; align-items: center; gap: 5px; margin: 0 13px 11px; background: #f0f0f0; border: none; border-radius: 6px; padding: 6px 13px; font-size: 13px; cursor: pointer; color: #333; font-weight: 500; }
.wa-copy-btn:hover { background: #e0e0e0; }
.wa-copy-btn.copied { background: #d4edda; color: #1a7431; }

/* ── Mobile ── */
@media (max-width: 640px) {
  body { font-size: 13px; }
  .header { padding: 10px 14px; flex-wrap: wrap; row-gap: 6px; }
  .header-title { font-size: 15px; }
  .nav { padding: 0 14px; }
  .nav-tab { padding: 10px 12px; font-size: 12.5px; }
  .page { padding: 12px 14px; }
  .event-heading { font-size: 13px; }
  .date-summary { font-size: 12px; }
  .room-table th, .room-table td { padding: 8px 10px; font-size: 12.5px; }
  .cell-card-title { font-size: 13px; }
  .table-toolbar { flex-direction: column; align-items: stretch; }
  .search-box { width: 100%; }
  .upload-zone { padding: 28px 14px; }
  .nc-ctrl-label { min-width: auto; }
}
.status-note{font-size:11px;color:#b45309;padding:6px 18px;background:#fffbeb;border-bottom:1px solid #fde68a}
.status-note[hidden]{display:none}

/* ── Public view + admin login ── */
.admin-only{display:none}
body.is-admin .admin-only{display:block}
body.is-admin .nav-tab.admin-only{display:inline-block}
.login-btn{background:#fff;color:#128C7E;border:1.5px solid #128C7E;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.login-btn:hover{background:#f0fdf4}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal-bg[hidden]{display:none}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal h3{font-size:16px;margin-bottom:4px}
.modal p{font-size:12px;color:#6b7280;margin-bottom:12px}
.modal input{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:16px;outline:none}
.modal input:focus{border-color:#128C7E}
.modal .err{color:#dc2626;font-size:12px;min-height:16px;margin-top:6px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.modal-actions button{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
.m-cancel{background:#f0f0f0;color:#333}.m-ok{background:#128C7E;color:#fff}
#page-public{max-width:760px;margin:0 auto}
.pub-intro{font-size:13px;color:#4b5563;margin-bottom:12px;line-height:1.5}
.pub-search{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:11px 14px;font-size:16px;outline:none;background:#fff;margin-bottom:12px}
.pub-search:focus{border-color:#128C7E}
.cell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell-tile{background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:all .15s}
.cell-tile:hover{border-color:#25d366;transform:translateY(-1px)}
.cell-tile .ct-name{font-weight:700;font-size:13.5px;color:#111}
.cell-tile .ct-next{font-size:11.5px;color:#6b7280;margin-top:4px;line-height:1.35}
.cell-tile.none{opacity:.55}
.back-btn{background:none;border:none;color:#128C7E;font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px}
.pub-cell-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px}
.pub-cell-sub{font-size:12.5px;color:#6b7280;margin-bottom:14px}
.month-head{font-size:12px;font-weight:700;color:#128C7E;text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.month-head::after{content:"";flex:1;height:1px;background:#d1d5db}
.bk{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden;border-left:4px solid #25d366}
.bk.next{border-left-color:#f59e0b}
.bk-main{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;background:none;border:none;text-align:left;font:inherit;color:inherit}
.bk-date{flex-shrink:0;text-align:center;min-width:46px}
.bk-date .d{font-size:22px;font-weight:800;line-height:1}
.bk-date .w{font-size:10.5px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-top:2px}
.bk-info{flex:1;min-width:0}
.bk-room{font-weight:700;font-size:14.5px}
.bk-time{font-size:12px;color:#6b7280;margin-top:2px}
.bk-badges{margin-top:5px}
.bk-badges .badge{margin:0 4px 0 0}
.bk-chev{color:#9ca3af;font-size:12px;transition:transform .15s}
.bk.open .bk-chev{transform:rotate(180deg)}
.bk-detail{display:none;padding:2px 14px 14px 72px;font-size:12.5px;line-height:1.6;color:#374151}
.bk.open .bk-detail{display:block}
.bk-detail ul{list-style:none}
.bk-detail li{margin-bottom:5px}
.bk-detail a{color:#128C7E;font-weight:600}
.next-tag{font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle}
@media(max-width:640px){.bk-detail{padding-left:14px}}
</style>
<!-- Header -->
<div class="header">
  <div>
    <div class="header-title">⛪ YA Cell Dashboard</div>
    <div class="header-sub">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Connecting…</span>
      <span id="ncStatusSep" style="display:none"> &nbsp;·&nbsp; </span>
      <span id="ncStatusText" style="display:none; color:#6b7280"></span>
    </div>
  </div>
  <div class="header-actions">
    <button class="login-btn" id="loginBtn" onclick="adminBtn()">🔒 Pastor/Admin</button>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">↻ Refresh</button>
  </div>
</div>

<div class="status-note" id="statusNote" hidden></div>

<!-- Navigation -->
<div class="nav">
  <button class="nav-tab active" id="tab-public"    onclick="switchPage('public')">🏠 Cell Bookings</button>
  <button class="nav-tab admin-only" id="tab-rooms"     onclick="switchPage('rooms')">📋 Bookings by Date</button>
  <button class="nav-tab admin-only" id="tab-celllist"  onclick="switchPage('celllist')">🗂️ Bookings by Cell Group</button>
  <button class="nav-tab admin-only" id="tab-wagen"     onclick="switchPage('wagen')">💬 Send Reminder</button>
  <button class="nav-tab admin-only" id="tab-newcomers" onclick="switchPage('newcomers')">👥 Newcomers</button>
</div>

<!-- Page: Bookings by Date -->
<!-- Page: Public -->
<div id="page-public" class="page">
  <div id="pubContent"></div>
</div>

<!-- Page: Bookings by Date -->
<div id="page-rooms" class="page" style="display:none">
  <div class="chips-row" id="eventChips"></div>
  <div id="roomsContent"></div>
</div>

<!-- Page: Cell List (per-cell overview across all upcoming dates) -->
<div id="page-celllist" class="page" style="display:none">
  <div class="table-toolbar" style="margin-bottom:12px">
    <span style="font-size:12px;color:#6b7280">Every cell, with all its upcoming dates &amp; rooms</span>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <input class="search-box" type="text" id="cellSearch" placeholder="🔍 Search cell name…" oninput="renderCellOverview()">
      <button class="copy-all-btn" id="copyAllBtn" onclick="copyAllCells(this)">📋 Copy All</button>
    </div>
  </div>
  <div id="cellListContent"></div>
</div>

<!-- Page: WA Messages (per-event, ready-to-send templates) -->
<div id="page-wagen" class="page" style="display:none">
  <div class="chips-row" id="eventChipsWA"></div>
  <div id="wagenContent"></div>
</div>

<!-- Page: Newcomers -->
<div id="page-newcomers" class="page" style="display:none">
  <label class="upload-zone" id="uploadZone"
    ondragover="dragOver(event)" ondragleave="dragLeave()" ondrop="dropFile(event)">
    <input type="file" id="csvInput" accept=".csv" onchange="handleFile(this.files[0])">
    <div class="upload-icon">📋</div>
    <div class="upload-title">Upload Newcomer CSV</div>
    <div class="upload-sub">Drag & drop or click below to load your newcomer list</div>
    <span class="upload-cta" onclick="event.preventDefault(); document.getElementById('csvInput').click()">Choose CSV File</span>
  </label>
  <div id="newcomerSection" style="display:none">
    <div class="nc-controls">
      <div class="nc-ctrl-row">
        <span class="nc-ctrl-label">Sort</span>
        <button class="sort-btn active" id="sort-az"     onclick="setSort('az')">A → Z</button>
        <button class="sort-btn"        id="sort-za"     onclick="setSort('za')">Z → A</button>
        <button class="sort-btn"        id="sort-recent" onclick="setSort('recent')">🕐 Recent Contact</button>
        <span style="flex:1;min-width:8px"></span>
        <input class="search-box" type="text" id="ncSearch" placeholder="🔍 Search name, cell…" oninput="renderNC()">
      </div>
      <div class="nc-ctrl-row">
        <span class="nc-ctrl-label">Filter</span>
        <button class="fchip active" id="fchip-all"  onclick="setFilter('all')">All</button>
        <button class="fchip"        id="fchip-week" onclick="setFilter('week')">This Week</button>

        <button class="fchip warn"   id="fchip-31"   onclick="setFilter('31')">31 – 60 days</button>

function getSGTMidnight(offsetDays) {
  const sgtNow = new Date(Date.now() + 8 * 3600 * 1000);
  sgtNow.setUTCHours(0, 0, 0, 0);
  sgtNow.setUTCDate(sgtNow.getUTCDate() + offsetDays);
  const p = n => n.toString().padStart(2, '0');
  return `${sgtNow.getUTCFullYear()}-${p(sgtNow.getUTCMonth()+1)}-${p(sgtNow.getUTCDate())}T00:00:00+08:00`;
}

function fmtRelative(date) {
  const diff = Math.floor((Date.now() - date.getTime()) / 1000);
  if (diff < 10)  return 'just now';
  if (diff < 60)  return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return date.toLocaleTimeString('en-SG', { hour:'numeric', minute:'2-digit', hour12:true });
}

  if (state === 'loading') {
    text.textContent = 'Refreshing…';
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">↻</span> Refresh';
  } else if (state === 'live') {
    text.textContent = 'Live · ' + fmtRelative(lastFetchTime);
    btn.disabled = false;
    btn.innerHTML = '↻ Refresh';
  } else if (state === 'error') {
    text.textContent = 'Cached data · ' + (detail || '');
    btn.disabled = false;
    btn.innerHTML = '↻ Refresh';
  } else {
    text.textContent = detail || '';
    btn.disabled = false;
    btn.innerHTML = '↻ Refresh';
  }
}

function joinList(arr) {

function buildDateSummary(rowsInfo) {

  const instruments = [];

  if (hasGuitar) instruments.push('Guitar');
  if (instruments.length) {
    out += ` ${joinList(instruments)} requested.`;

  return out;

// ── CELL LIST PAGE (cell-first grouping) ────────────────────────────────────
const CELL_ORDER = [
  "The Dwelling","Oasis","Selah","Restored","Restful Presence","Seekers of Rest","Sprouts",
  "Lion & Lamb","Happinest","Happy Space","HEAppy Home","Happy Corner","Pocketful of Joy",
  "Nest of Joy (N'Joy)","Everlasting Covenant (E'Cove)","WOW!","VVAVESTORE","the VVAVES co.op",
  "PayVVave","Rooted & Grounded","SPRING","The Branch","The Oak","Afresh","Light up",
  "Peace and Joy","Safe Haven","Duracell","LiveWire"
];

function normCell(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

const CELL_ORDER_NORM = CELL_ORDER.map(normCell);

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function cellOrderIndex(cgRaw) {
  const q = normCell(cgRaw);
  if (!q) return CELL_ORDER.length;

  let idx = CELL_ORDER_NORM.indexOf(q);
  if (idx !== -1) return idx;

  let best = -1, bestLen = -1;
  CELL_ORDER_NORM.forEach((c, i) => {
    if (q.includes(c) || c.includes(q)) {
      const len = Math.min(c.length, q.length);
      if (len > bestLen) { bestLen = len; best = i; }
    }
  });
  if (best !== -1) return best;

  let bestDist = Infinity, bestIdx = -1;
  CELL_ORDER_NORM.forEach((c, i) => {
    const d = levenshtein(q, c);
    const threshold = Math.max(2, Math.floor(Math.min(q.length, c.length) * 0.3));
    if (d <= threshold && d < bestDist) { bestDist = d; bestIdx = i; }
  });
  if (bestIdx !== -1) return bestIdx;

  return CELL_ORDER.length;
}

function renderCellOverview() {
  const events = liveEvents || FALLBACK_EVENTS;
  const searchEl = document.getElementById('cellSearch');
  const search = searchEl ? searchEl.value.toLowerCase().trim() : '';

  const known     = new Map();
  const unmatched = new Map();

  events.forEach(ev => {
    if (!ev.description) return;
    const rows = ev.description.split('\n').map(parseLine).filter(Boolean);
    rows.forEach(({ room, cg }) => {
      const ac     = isAC(room);
      const piano  = hasPiano(room) || hasPiano(cg);
      const guitar = hasGuitar(room) || hasGuitar(cg);
      const cleanRoom = room
        .replace(/\s*\+\s*(piano|guitar|cajon|first aid kit)(\s*\+\s*(piano|guitar|cajon|first aid kit))*/gi, '')
        .replace(/,\s*$/, '').trim();
      const booking = { date: ev.date, room: cleanRoom, ac, piano, guitar };

      const idx = cellOrderIndex(cg);
      if (idx < CELL_ORDER.length) {
        if (!known.has(idx)) known.set(idx, { name: CELL_ORDER[idx], bookings: [] });
        known.get(idx).bookings.push(booking);
      } else {
        const key = cg.trim().toLowerCase();
        if (!unmatched.has(key)) unmatched.set(key, { name: cg.trim(), bookings: [] });
        unmatched.get(key).bookings.push(booking);
      }
    });
  });

  let cells = CELL_ORDER.map((name, i) => known.get(i) || { name, bookings: [] });
  const extras = [...unmatched.values()].sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  cells = cells.concat(extras);
  cells.forEach(c => c.bookings.sort((a, b) => new Date(a.date) - new Date(b.date)));

  if (search) cells = cells.filter(c => c.name.toLowerCase().includes(search));

  const content = document.getElementById('cellListContent');
  if (!cells.length) {
    CELL_OVERVIEW_TEXTS = [];
    content.innerHTML = '<div class="no-rooms">No cells match this search.</div>';
    return;
  }

  const todayHeader = fmtTodayHeader();
  CELL_OVERVIEW_TEXTS = cells.map(c => {
    const lines = c.bookings.length
      ? c.bookings.map(b => `${fmtDateCopy(b.date)} — ${b.room}${b.ac ? ' (AC)' : ''}${b.piano ? ' (Piano)' : ''}${b.guitar ? ' (Guitar)' : ''}`)
      : ['No upcoming bookings'];
    return `*Latest booking as ${todayHeader}: ${c.name}*\n${lines.join('\n')}`;
  });

  content.innerHTML = cells.map((c, i) => {
    const rowsHtml = c.bookings.length
      ? c.bookings.map(b => {
          const pianoTag  = b.piano ? `<span class="badge badge-piano">🎹 Piano</span>` : '';
          const guitarTag = b.guitar ? `<span class="badge badge-guitar">🎸 Guitar</span>` : '';
          const typeBadge = b.ac
            ? `<span class="badge badge-ac">❄️ AC Remote</span>`
            : `<span class="badge badge-std">Standard</span>`;
          const todayTag = isToday(b.date) ? '<span class="day-badge is-today" style="margin-left:6px">Today</span>' : '';
          return `<tr>
            <td>${esc(fmtDateLong(b.date))}${todayTag}</td>
            <td>${esc(b.room)}</td>
            <td>${typeBadge}${pianoTag}${guitarTag}</td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="3" style="text-align:center;color:#bbb;padding:14px">No upcoming bookings</td></tr>`;

    return `<div class="room-card" style="margin-bottom:12px">
      <div class="cell-card-head">
        <span class="cell-card-title">${esc(c.name)}</span>
        <button class="mini-copy-btn" onclick="copyCellText(${i}, this)">📋 Copy</button>
      </div>
      <div class="room-table-scroll"><table class="room-table">
        <thead><tr>
          <th class="col-wide">Date</th>
          <th>Room</th>
          <th class="col-fixed">Request type</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

// ── WA MESSAGES PAGE (per-event, ready-to-send templates) ───────────────────
const WA_SPECIAL = ['guest lounge','m6-2'];
function isWASpecial(room) { return WA_SPECIAL.some(s => room.toLowerCase().includes(s)); }
const AV_LINK = "https://tiny.cc/ya26cgroom";

function buildWAT1(date, cg, loc, hasPianoFlag, hasGuitarFlag) {
  let n = 3;
  let extra = '';
  if (hasPianoFlag)  { extra += `\n${n}.⁠ ⁠*Piano collection/return*🎹: office front desk`;  n++; }
  if (hasGuitarFlag) { extra += `\n${n}.⁠ ⁠*Guitar collection/return*🎸: office front desk`; n++; }
  return `*Date:* ${date}\n\n*Cell group:* ${cg}\n\n*Location:* ${loc}\n\n*Note:*\n1.⁠ ⁠*Key collection/return*🔑: guard post (level 4).\n•⁠  ⁠Can collect anytime from 5pm & onwards\n2.⁠ ⁠*Sound system & projector setup guide*🎥: ${AV_LINK}${extra}\n${n}.⁠ ⁠*CG Signange return*🪧: guard post (level 4)\n•⁠  ⁠Pls return together with keys ✨`;
}
function buildWAT2(date, cg, loc, hasPianoFlag, hasGuitarFlag) {
  let n = 4;
  let extra = '';
  if (hasPianoFlag)  { extra += `\n${n}.⁠ ⁠*Piano collection/return*🎹: office front desk`;  n++; }
  if (hasGuitarFlag) { extra += `\n${n}.⁠ ⁠*Guitar collection/return*🎸: office front desk`; n++; }
  return `*Date:* ${date}\n\n*Cell group:* ${cg}\n\n*Location:* ${loc}\n\n*Note:*\n1.⁠ ⁠*Key collection/return*🔑: guard post (level 4).\n•⁠  ⁠Can collect anytime from 5pm & onwards\n2.⁠ ⁠*Sound system & projector setup guide*🎥: ${AV_LINK}\n3.⁠ ⁠*Aircon Remote collection/return* ❄️: guard post (level 4)\n•⁠  ⁠Pls check all aircons are switched off ☺️${extra}\n${n}.⁠ ⁠*CG Signange return*🪧: guard post (level 4)\n•⁠  ⁠Pls return together with keys ✨`;
}

function copyWAMsg(btn, id) {
  const ta = document.getElementById(id);
  ta.select(); ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
  } catch (e) { btn.textContent = 'Press Ctrl/Cmd+C'; }
}

function buildWAChips(keepIdx) {
  const events = liveEvents || FALLBACK_EVENTS;
  const row    = document.getElementById('eventChipsWA');
  row.innerHTML = '';
  const now = new Date();
  let defaultIdx = 0;
  events.forEach((ev, i) => {
    const d = new Date(ev.date);
    if (d < now && !isToday(ev.date) && defaultIdx === i) defaultIdx = i + 1;
    const btn = document.createElement('button');
    btn.className = 'chip' + (isToday(ev.date) ? ' today' : '');
    btn.textContent = fmtShort(ev.date);
    btn.onclick = () => showWAEvent(i);
    row.appendChild(btn);
  });
  if (defaultIdx >= events.length) defaultIdx = 0;
  const idx = (keepIdx !== undefined && keepIdx < events.length) ? keepIdx : defaultIdx;
  showWAEvent(idx);
}

function showWAEvent(idx) {
  const events = liveEvents || FALLBACK_EVENTS;
  selectedIdxWA = idx;
  document.querySelectorAll('#eventChipsWA .chip').forEach((c, i) => c.classList.toggle('active', i === idx));
  const ev      = events[idx];
  const date    = fmtDateNoTime(ev.date);
  const content = document.getElementById('wagenContent');

  if (!ev.description) {
    content.innerHTML = '<div class="no-rooms">No room bookings in this event\'s description yet.</div>';
    return;
  }

  const lines = ev.description.split('\n');
  let msgIdx = 0;
  let any = false;
  let html = '<div class="wa-messages">';

  lines.forEach(line => {
    const parsed = parseLine(line);
    if (!parsed) return;
    any = true;
    const { room, cg } = parsed;
    const special = isWASpecial(room);
    const hasPianoFlag = hasPiano(room) || hasPiano(cg);
    const hasGuitarFlag = hasGuitar(room) || hasGuitar(cg);
    const cleanRoom = room
      .replace(/\s*\+\s*(piano|guitar|cajon|first aid kit)(\s*\+\s*(piano|guitar|cajon|first aid kit))*/gi, '')
      .replace(/,\s*$/, '').trim();
    const cleanCg = cg.trim();
    const msg = special ? buildWAT2(date, cleanCg, cleanRoom, hasPianoFlag, hasGuitarFlag) : buildWAT1(date, cleanCg, cleanRoom, hasPianoFlag, hasGuitarFlag);
    const id = `wamsg-${idx}-${msgIdx++}`;
    const instrTags = (hasPianoFlag ? ' 🎹' : '') + (hasGuitarFlag ? ' 🎸' : '');
    html += `
      <div class="wa-msg-block">
        <div class="wa-msg-header">
          <span class="wa-msg-label">📍 ${esc(cleanRoom)} · ${esc(cleanCg)}${instrTags}</span>
          <span class="wa-msg-badge ${special ? 'wa-badge-sp' : 'wa-badge-std'}">${special ? 'Template 2 (AC)' : 'Template 1'}</span>
        </div>
        <textarea class="wa-msg-body" id="${id}" readonly onclick="this.select()">${esc(msg)}</textarea>
        <button class="wa-copy-btn" onclick="copyWAMsg(this,'${id}')">📋 Copy</button>
      </div>`;
  });

  html += '</div>';
  if (!any) {
    content.innerHTML = '<div class="no-rooms">No room bookings in this event\'s description yet.</div>';
    return;
  }
  content.innerHTML = html;
  content.querySelectorAll('.wa-msg-body').forEach(ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
}

// ── NEWCOMERS PAGE ────────────────────────────────────────────────────────
const NC_COL_DEFS = [
  { label: 'Full Name',         keys: ['full name','name'] },
  { label: 'Gender',            keys: ['gender'] },
  { label: 'Phone',             keys: ['phone','contact'] },
  { label: 'Attending Service', keys: ['attending','service'] },
  { label: 'Cell / Assignee',   keys: ['cell','assign'] },
  { label: 'Last Contacted',    keys: ['last contact','contacted','last'] },
];

let ncRows     = [];
let ncColMap   = [];
let ncSortType = 'az';
let ncFilter   = 'all';

function dragOver(e) { e.preventDefault(); document.getElementById('uploadZone').classList.add('drag'); }
function dragLeave()  { document.getElementById('uploadZone').classList.remove('drag'); }
function dropFile(e)  { e.preventDefault(); dragLeave(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const { headers, rows } = parseCSV(e.target.result);
    if (!rows.length) { showNote('No data found in that CSV.'); return; }
    loadNewcomers(headers, rows);
  };
  reader.readAsText(file);
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return { headers: [], rows: [] };
  const headers = parseCSVRow(lines[0]);
  const rows = lines.slice(1).filter(l => l.trim()).map(l => {
    const vals = parseCSVRow(l);
    const obj  = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  });
  return { headers, rows };
}

function parseCSVRow(line) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1]==='"') { cur+='"'; i++; } else q=!q; }
    else if (c === ',' && !q) { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}

function findHeader(headers, keys) {
  for (const k of keys) {
    const h = headers.find(h => h.toLowerCase().includes(k.toLowerCase()));
    if (h) return h;
  }
  return null;
}

function parseContactDate(str) {
  if (!str || str === '–' || !str.trim()) return null;
  str = str.trim();
  let d = new Date(str);
  if (!isNaN(d.getTime()) && d.getFullYear() > 2000) return d;
  let m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) { d = new Date(+m[3], +m[2]-1, +m[1]); if (!isNaN(d.getTime())) return d; }
  m = str.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);
  if (m) { d = new Date(`${m[2]} ${m[1]}, ${m[3]}`); if (!isNaN(d.getTime())) return d; }
  return null;
}

function getDaysAgo(str) {
  const d = parseContactDate(str);
  return d ? Math.floor((Date.now() - d.getTime()) / 86400000) : null;
}

function setSort(type) {
  ncSortType = type;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('sort-' + type);
  if (btn) btn.classList.add('active');
  renderNC();
}

function setFilter(f) {
  ncFilter = f;
  document.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('fchip-' + f);
  if (btn) btn.classList.add('active');
  renderNC();
}

function loadNewcomers(headers, rows) {
  ncRows   = rows;
  ncColMap = NC_COL_DEFS
    .map(def => ({ label: def.label, rawKey: findHeader(headers, def.keys) }))
    .filter(c => c.rawKey);

  const thead = document.getElementById('ncHead');
  thead.innerHTML = '';
  ncColMap.forEach(col => {
    const th = document.createElement('th');
    th.textContent = col.label;
    thead.appendChild(th);
  });

  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('newcomerSection').style.display = '';

  const ts = new Date().toLocaleString('en-SG', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true });
  document.getElementById('ncStatusSep').style.display  = '';
  document.getElementById('ncStatusText').style.display = '';
  document.getElementById('ncStatusText').textContent   = `Newcomers: ${rows.length} · loaded ${ts}`;

  setSort('az');
  setFilter('all');
}

function renderNC() {
  const search     = (document.getElementById('ncSearch').value || '').toLowerCase();
  const contactCol = ncColMap.find(c => c.label === 'Last Contacted');
  const nameCol    = ncColMap.find(c => c.label === 'Full Name');

  let rows = ncRows.filter(row => {
    if (ncFilter === 'all') return true;
    if (!contactCol) return true;
    const days = getDaysAgo(row[contactCol.rawKey]);
    if (days === null) return false;
    if (ncFilter === 'week') return days <= 7;
    if (ncFilter === '30')   return days <= 30;
    if (ncFilter === '31')   return days >= 31 && days < 60;
    if (ncFilter === '60')   return days >= 60;
    return true;
  });

  if (search) rows = rows.filter(row =>
    Object.values(row).some(v => v.toLowerCase().includes(search))
  );

  rows = [...rows].sort((a, b) => {
    if (ncSortType === 'az' || ncSortType === 'za') {
      const key = nameCol ? nameCol.rawKey : (ncColMap[0] ? ncColMap[0].rawKey : null);
      if (!key) return 0;
      const av = (a[key]||'').toLowerCase(), bv = (b[key]||'').toLowerCase();
      return ncSortType === 'az' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    if (ncSortType === 'recent' && contactCol) {
      const da = parseContactDate(a[contactCol.rawKey]);
      const db = parseContactDate(b[contactCol.rawKey]);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return db.getTime() - da.getTime();
    }
    return 0;
  });

  document.getElementById('ncCount').textContent =
    rows.length === ncRows.length
      ? `${rows.length} newcomer${rows.length !== 1 ? 's' : ''}`
      : `${rows.length} of ${ncRows.length}`;

  const tbody = document.getElementById('ncBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${ncColMap.length}" class="empty-nc">No newcomers match this filter.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(row =>
    '<tr>' + ncColMap.map(col => {
      const val = row[col.rawKey] || '–';
      let cls = '';
      if (col.label === 'Gender') {
        cls = val.toLowerCase().startsWith('m') ? 'gender-m' : val.toLowerCase().startsWith('f') ? 'gender-f' : '';
      }
      if (col.label === 'Last Contacted') {
        const days = getDaysAgo(val);
        if (days !== null) cls = days >= 60 ? 'days-danger' : days >= 31 ? 'days-warn' : '';
      }
      return `<td${cls ? ` class="${cls}"` : ''}>${esc(val)}</td>`;
    }).join('') + '</tr>'
  ).join('');
}


// ── PUBLIC VIEW (cell picker → bookings grouped by month) ────────────────
const TZ = 'Asia/Kuala_Lumpur';
let pubCell = null;
try { pubCell = localStorage.getItem('yaPubCell'); } catch(e){}
function pubGroups() {
  const events = liveEvents || FALLBACK_EVENTS;
  const now = Date.now() - 4*3600*1000;
  const known = new Map(), unmatched = new Map();
  events.forEach(ev => {
    if (!ev.description || new Date(ev.date).getTime() < now) return;
    ev.description.split('\n').map(parseLine).filter(Boolean).forEach(({room, cg}) => {
      const cleanRoom = room.replace(/\s*\+\s*(piano|guitar|cajon|first aid kit)(\s*\+\s*(piano|guitar|cajon|first aid kit))*/gi,'').replace(/,\s*$/,'').trim();
      const b = { date: ev.date, room: cleanRoom, ac: isAC(room), piano: hasPiano(room)||hasPiano(cg), guitar: hasGuitar(room)||hasGuitar(cg) };
      const idx = cellOrderIndex(cg);
      if (idx < CELL_ORDER.length) { if(!known.has(idx)) known.set(idx,{name:CELL_ORDER[idx],bookings:[]}); known.get(idx).bookings.push(b); }
      else { const k=cg.trim().toLowerCase(); if(!unmatched.has(k)) unmatched.set(k,{name:cg.trim(),bookings:[]}); unmatched.get(k).bookings.push(b); }
    });
  });
  let cells = CELL_ORDER.map((n,i)=>known.get(i)||{name:n,bookings:[]}).concat([...unmatched.values()]);
  cells.forEach(c=>c.bookings.sort((a,b)=>new Date(a.date)-new Date(b.date)));
  return cells.sort((a,b)=>(b.bookings.length>0)-(a.bookings.length>0)||a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
}
function fmtTimeOnly(iso){ return new Date(iso).toLocaleTimeString('en-SG',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:TZ}); }
function pubBadges(b){
  return (b.ac?'<span class="badge badge-ac">❄️ AC Remote</span>':'<span class="badge badge-std">Standard</span>')
   + (b.piano?'<span class="badge badge-piano">🎹 Piano</span>':'') + (b.guitar?'<span class="badge badge-guitar">🎸 Guitar</span>':'');
}
function pubDetail(b){
  let li = '<li>🔑 <b>Key</b>: collect/return at guard post (level 4). Can collect from 5pm onwards.</li>'
    + `<li>🎥 <b>Sound system &amp; projector guide</b>: <a href="${AV_LINK}" target="_blank" rel="noopener">${AV_LINK.replace('https://','')}</a></li>`;
  if (b.ac) li += '<li>❄️ <b>Aircon remote</b>: collect/return at guard post (level 4). Please switch off all aircons.</li>';
  if (b.piano) li += '<li>🎹 <b>Piano</b>: collect/return at office front desk.</li>';
  if (b.guitar) li += '<li>🎸 <b>Guitar</b>: collect/return at office front desk.</li>';
  li += '<li>🪧 <b>CG signage</b>: return to guard post (level 4) together with the keys.</li>';
  return '<ul>'+li+'</ul>';
}
function pickCell(name){ pubCell = name; try{ name?localStorage.setItem('yaPubCell',name):localStorage.removeItem('yaPubCell'); }catch(e){} renderPublic(); window.scrollTo(0,0); }
function toggleBk(el){ el.closest('.bk').classList.toggle('open'); }
function renderPublic(){
  const box = document.getElementById('pubContent'); if(!box) return;
  const cells = pubGroups();
  const cur = pubCell && cells.find(c=>c.name===pubCell);
  if (cur) {
    let html = `<button class="back-btn" onclick="pickCell(null)">← All cells</button>
      <div class="pub-cell-title">${esc(cur.name)}</div>
      <div class="pub-cell-sub">${cur.bookings.length ? cur.bookings.length+' upcoming booking'+(cur.bookings.length!==1?'s':'')+' · tap a booking for collection details' : 'No upcoming room bookings yet.'}</div>`;
    let month = '', first = true;
    cur.bookings.forEach(b => {
      const d = new Date(b.date);
      const m = d.toLocaleDateString('en-SG',{month:'long',year:'numeric',timeZone:TZ});
      if (m !== month) { month = m; html += `<div class="month-head">${esc(m)}</div>`; }
      html += `<div class="bk${first?' next':''}">
        <button class="bk-main" onclick="toggleBk(this)">
          <div class="bk-date"><div class="d">${d.toLocaleDateString('en-SG',{day:'numeric',timeZone:TZ})}</div><div class="w">${d.toLocaleDateString('en-SG',{weekday:'short',timeZone:TZ})}</div></div>
          <div class="bk-info"><div class="bk-room">${esc(b.room)}${first?'<span class="next-tag">NEXT</span>':''}</div>
            <div class="bk-time">${esc(d.toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'short',timeZone:TZ}))} · ${esc(fmtTimeOnly(b.date))}</div>
            <div class="bk-badges">${pubBadges(b)}</div></div>
          <span class="bk-chev">▼</span>
        </button>
        <div class="bk-detail">${pubDetail(b)}</div>
      </div>`;
      first = false;
    });
    box.innerHTML = html; return;
  }
  const q = (document.getElementById('pubSearch')||{}).value || '';
  box.innerHTML = `<div class="pub-intro">Find your cell group to see its upcoming room bookings, by month.</div>
    <input class="pub-search" id="pubSearch" type="search" placeholder="🔍 Search your cell name…" oninput="renderPubGrid()" value="${esc(q)}">
    <div class="cell-grid" id="pubGrid"></div>`;
  renderPubGrid();
}
function renderPubGrid(){
  const q = ((document.getElementById('pubSearch')||{}).value||'').toLowerCase().trim();
  const cells = pubGroups().filter(c=>!q||c.name.toLowerCase().includes(q));
  const g = document.getElementById('pubGrid'); if(!g) return;
  g.innerHTML = cells.length ? cells.map(c=>{
    const n=c.bookings[0];
    const nx = n ? 'Next: '+esc(new Date(n.date).toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short',timeZone:TZ}))+' · '+esc(n.room) : 'No upcoming bookings';
    return `<button class="cell-tile${n?'':' none'}" data-c="${esc(c.name)}"><div class="ct-name">${esc(c.name)}</div><div class="ct-next">${nx}</div></button>`;
  }).join('') : '<div class="no-rooms" style="grid-column:1/-1">No cells match.</div>';
  g.querySelectorAll('.cell-tile').forEach(t=>t.onclick=()=>pickCell(t.dataset.c));
}
